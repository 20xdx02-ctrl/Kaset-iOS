name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One build per branch: a new push or manual run replaces the one still queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (15.0)
    # macOS 26 (Intel) — arm64 runners (macos-15 / macos-26 / macos-latest) have a small
    # pool and queue for a long time. The Intel image is newer than macos-15 and has
    # more capacity, while still shipping a current Xcode able to target iOS 15.0.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KasetiOS.xcodeproj \
            -scheme KasetiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r KasetiOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasetiOS-unsigned
          path: KasetiOS-unsigned.ipa
