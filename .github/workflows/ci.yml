name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (15.0)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || \
          sudo xcode-select -s /Applications/Xcode_16.1.app || \
          sudo xcode-select -s /Applications/Xcode_16.0.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KasetiOS.xcodeproj \
            -scheme KasetiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package simulator app
        run: |
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -name '*.app' -maxdepth 1 | head -1)
          echo "App: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" KasetiOS-simulator.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasetiOS-simulator
          path: KasetiOS-simulator.zip
